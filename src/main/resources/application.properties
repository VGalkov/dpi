# ============================================
# \u041E\u0411\u0429\u0418\u0415 \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418
# ============================================
date.format             = dd-MM-yyyy HH:mm:ss
timezone                = Europe/Samara
locale.prefix           = ru

# ============================================
# DNS \u0421\u0415\u0420\u0412\u0415\u0420
# ============================================
dns.local.port          = 53
dns.start               = true
dns.thread.num          = 150
dns.timeout             = 4

# DNS Rate Limiting (\u043D\u0430 100 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u0432: 100 RPS \u00D7 100 = 10000 RPS \u0441\u0443\u043C\u043C\u0430\u0440\u043D\u043E)
dns.rate-limit.enabled  = true
dns.rate-limit.requests-per-second = 100
dns.rate-limit.burst    = 200
dns.rate-limit.client-idle-seconds = 300

# DNS Upstream
dns.list                = 77.88.8.8,8.8.8.8,8.8.4.8,1.1.1.1,1.0.0.1

# ============================================
# DNS SERVER PERFORMANCE
# ============================================
# \u041A\u044D\u0448 \u0434\u043B\u044F getQuestionName() (\u0440\u0430\u0437\u043C\u0435\u0440 \u0438 TTL)
dns.qname-cache.enabled=true
dns.qname-cache.max-size=10000
dns.qname-cache.ttl-seconds=300

# ============================================
# DNS SERVER MEMORY LIMITS (\u0437\u0430\u0449\u0438\u0442\u0430 \u043E\u0442 OOM)
# ============================================
dns.max-qname-cache-size=10000
dns.max-queries-by-client=10000
dns.max-active-udp-sockets-multiplier=2
dns.max-dns-cache-size=100

# ============================================
# DNS SERVER PACKET POOL
# ============================================
# \u2705 \u041F.21: Packet pool size (\u043E\u043F\u0442\u0438\u043C\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u043D\u043E \u043F\u043E\u0434 100 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439)
dns.packet-pool.size=200

# \u2705 \u041F.5: \u041A\u043E\u043D\u0441\u0442\u0430\u043D\u0442\u044B DNS server
dns.max-packet-size=4096
dns.max-clients-multiplier=10
dns.max-active-sockets-multiplier=2

# ============================================
# HTTP/HTTPS PROXY
# ============================================
proxy.local.port        = 8888
proxy.start             = true

# \u041B\u0438\u043C\u0438\u0442\u044B \u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u0438\u0439 (100 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u0432 \u00D7 10-20 \u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u0438\u0439 = 1000-2000)
proxy.max-connections           = 1500
proxy.max-connections-per-client = 25

# \u0422\u0430\u0439\u043C\u0430\u0443\u0442\u044B
proxy.connect-timeout-millis    = 8000
proxy.client-read-timeout-millis = 30000
proxy.remote-read-timeout-millis = 30000

# \u041B\u0438\u043C\u0438\u0442\u044B \u0434\u0430\u043D\u043D\u044B\u0445
proxy.max-header-bytes          = 32768
proxy.max-body-bytes            = 10485760

# ============================================
# BLACKLIST
# ============================================
blacklist.local.enabled         = true
blacklist.adguard.enabled       = true
blacklist.mvps_hosts.enabled    = true
blacklist.rkn.enabled           = true

blacklist.local.file            = blacklist.txt
blacklist.rkn.xml-file          = src/main/resources/register/dump.xml
blacklist.adguard.url           = https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
blacklist.adguard.connect-timeout = 10000
blacklist.adguard.read-timeout  = 30000
blacklist.mvps_hosts.url        = https://winhelp2002.mvps.org/hosts.txt

# \u041F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0430 blacklist (6 \u0447\u0430\u0441\u043E\u0432 = 21600 \u0441\u0435\u043A)
blacklist.reload.enabled        = true
blacklist.reload.interval-seconds = 21600

# ============================================
# DNS ANOMALY DETECTOR (LLM)
# ============================================
dns.anomaly-detector.enabled            = true
dns.anomaly-detector.llm-studio.url     = http://localhost:1234/v1/chat/completions
dns.anomaly-detector.llm-studio.model   = gemma-2-2b-it-Q5_K_M
dns.anomaly-detector.llm-studio.timeout-seconds = 120
dns.anomaly-detector.llm-studio.api-key =
dns.anomaly-detector.trust-threshold    = 0.7
dns.anomaly-detector.processed-ttl-seconds = 120
dns.anomaly-detector.buffer-size        = 1000
dns.anomaly-detector.batch-size         = 50
dns.anomaly-detector.batch-timeout-seconds = 10
dns.anomaly-detector.blocklist-ttl-minutes = 60

# ============================================
# HTTP ANOMALY DETECTOR (LLM)
# ============================================
http.anomaly-detector.enabled           = true
http.anomaly-detector.llm-studio.url    = http://localhost:1234/v1/chat/completions
http.anomaly-detector.llm-studio.model  = gemma-2-2b-it-Q5_K_M
http.anomaly-detector.llm-studio.timeout-seconds = 120
http.anomaly-detector.llm-studio.api-key =
http.anomaly-detector.trust-threshold   = 0.7
http.anomaly-detector.processed-ttl-seconds = 1800
http.anomaly-detector.inspect-body      = true

# ============================================
# DNS SERVER PERFORMANCE OPTIMIZATIONS
# ============================================
# \u2705 \u041F.7: ThreadLocal buffer \u0434\u043B\u044F queryData
dns.query-data-buffer.enabled=true
dns.query-data-buffer.size=4096

# \u2705 \u041F.8: ThreadLocal \u0434\u043B\u044F DataInputStream \u0432 TCP
dns.tcp-datainputstream-pool.enabled=true

# ============================================
# DNS SERVER RELIABILITY & MONITORING
# ============================================
# \u2705 \u041F.11: TCP socket timeout
dns.tcp.socket-timeout-millis=30000
dns.tcp.keep-alive=true
dns.tcp.no-delay=true

# \u2705 \u041F.17: \u041B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u043D\u044B\u0445 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u0432
dns.logging.rate-limit-enabled=true
dns.logging.rate-limit-log-level=WARN

# \u2705 \u041F.19: \u0417\u0430\u0449\u0438\u0442\u0430 \u043E\u0442 \u0433\u043E\u043D\u043E\u043A
dns.concurrent.max-retries=3


