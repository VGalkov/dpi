    # ============================================================
    # \u041E\u0411\u0429\u0418\u0415 \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 \u041F\u0420\u0418\u041B\u041E\u0416\u0415\u041D\u0418\u042F
    # ============================================================

    date.format=dd-MM-yyyy HH:mm:ss
    timezone=Europe/Samara
    locale.prefix=ru

    app.name=DPI-Proxy
    app.version=1.0.0
    app.locale=ru


    # ============================================================
    # DNS-\u0421\u0415\u0420\u0412\u0415\u0420
    # ============================================================

    dns.start=true
    dns.local.port=53
    dns.thread.num=256
    dns.timeout=3

    dns.list=77.88.8.8,1.1.1.1,8.8.8.8,8.8.4.4,1.0.0.1


    # ============================================================
    # DNS RATE LIMITER
    # ============================================================

    dns.rate-limit.enabled=true
    dns.rate-limit.requests-per-second=300
    dns.rate-limit.burst=600
    dns.rate-limit.client-idle-seconds=300
    dns.rate-limit.cleanup-every-n-requests=10000
    dns.rate-limit.cleanup-percent-to-remove=10


    # ============================================================
    # DNS CLIENT \u0418 CONNECTION LIMITS
    # ============================================================

    dns.max-queries-by-client=2000
    dns.max-tcp-connections-per-client=50
    dns.max-active-tcp-sessions=500

    dns.max-active-udp-sockets-multiplier=2
    dns.max-clients-multiplier=20
    dns.max-active-sockets-multiplier=3


    # ============================================================
    # DNS PACKET POOL \u0418 BUFFERS
    # ============================================================

    dns.packet-pool.size=1024
    dns.max-packet-size=4096
    dns.max-response-size=4096

    dns.query-data-buffer.enabled=true
    dns.query-data-buffer.size=4096

    dns.qname-cache.enabled=true
    dns.qname-cache.max-size=50000
    dns.qname-cache.ttl-seconds=300

    dns.max-qname-cache-size=50000
    dns.tcp-datainputstream-pool.enabled=true


    # ============================================================
    # DNS RESOLVER CACHE
    # ============================================================

    dns.dns-cache-ttl-minutes=10
    dns.max-dns-cache-size=256


    # ============================================================
    # DNS TCP
    # ============================================================

    dns.tcp.socket-timeout-millis=30000
    dns.tcp.keep-alive=true
    dns.tcp.no-delay=true


    # ============================================================
    # DNS CLEANUP \u0418 LOGGING
    # ============================================================

    dns.cache-cleanup-interval-seconds=60

    dns.logging.rate-limit-enabled=true
    dns.logging.rate-limit-log-level=WARN


    # ============================================================
    # HTTP/HTTPS PROXY
    # ============================================================

    proxy.start=true
    proxy.local.port=8888

    proxy.max-connections=10000
    proxy.max-connections-per-client=100
    proxy.max-active-sockets-multiplier=2
    proxy.cleanup-sockets-per-iteration=100
    proxy.idle-socket-timeout-seconds=120

    proxy.block-on-sni-mismatch=false


    # ============================================================
    # HTTP PROXY TIMEOUTS
    # ============================================================

    proxy.connect-timeout-millis=8000
    proxy.client-read-timeout-millis=30000
    proxy.remote-read-timeout-millis=30000


    # ============================================================
    # HTTP REQUEST LIMITS
    # ============================================================

    proxy.max-header-bytes=32768
    proxy.max-body-bytes=52428800
    proxy.stream-body-threshold=262144


    # ============================================================
    # HTTP RESPONSE LIMITS
    # ============================================================

    proxy.limit-response-body=false
    proxy.max-response-bytes=104857600


    # ============================================================
    # HTTPS CONNECT \u0418 SNI
    # ============================================================

    proxy.tls.max-record-size=18432
    proxy.tls.max-hello-size=65536
    proxy.tls.read-timeout-ms=10000
    proxy.tls.header-len=5
    proxy.tls.content-type-handshake=22
    proxy.tls.hello-padding=40
    proxy.tls.min-length=9
    proxy.tls.fixed-header-size=34


    # ============================================================
    # HTTP PROXY BUFFERS \u0418 DEFAULTS
    # ============================================================

    proxy.buffer-size=16384
    proxy.default-http-port=80


    # ============================================================
    # BLACKLIST SOURCES
    # ============================================================

blacklist.local.enabled=true
blacklist.adguard.enabled=true
blacklist.mvps_hosts.enabled=true
blacklist.rkn.enabled=true
blacklist.rkn.remote.enabled=true
rkn.real.enabled=true

    blacklist.local.file=blacklist.txt
    blacklist.rkn.xml-file=src/main/resources/register/dump.xml


    # ============================================================
    # ADGUARD BLACKLIST
    # ============================================================

    blacklist.adguard.url=https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
    blacklist.adguard.connect-timeout=10000
    blacklist.adguard.read-timeout=30000


    # ============================================================
    # MVPS HOSTS BLACKLIST
    # ============================================================

    blacklist.mvps_hosts.url=https://winhelp2002.mvps.org/hosts.txt
    blacklist.mvps_hosts.connect-timeout=10000
    blacklist.mvps_hosts.read-timeout=30000


    # ============================================================
    # BLACKLIST LIMITS
    # ============================================================

    blacklist.max-rules-per-source=500000
    blacklist.max-rules-rkn=10000000
    blacklist.max-rules-total=10000000

    blacklist.max-memory-mb=8192
    blacklist.loader-thread-pool-size=4


    # ============================================================
    # BLACKLIST RELOAD
    # ============================================================

    blacklist.reload.enabled=true
    blacklist.reload.interval-seconds=21600


    # ============================================================
    # BLACKLIST SNAPSHOT CACHE
    # ============================================================

    blacklist.snapshot-cache-ttl-millis=5000

    blacklist.snapshot.max-ip-cache-size=100000
    blacklist.snapshot.max-domain-cache-size=200000
    blacklist.snapshot.cache-ttl-millis=60000


    # ============================================================
    # DNS ANOMALY DETECTOR (LLM)
    # ============================================================

    # LLM \u0432\u043A\u043B\u044E\u0447\u0451\u043D, \u043D\u043E \u043E\u0431\u0440\u0430\u0449\u0435\u043D\u0438\u044F \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u044E\u0442\u0441\u044F \u0440\u0435\u0434\u043A\u043E.
    dns.anomaly-detector.enabled=true

    dns.anomaly-detector.llm-studio.url=http://localhost:1234/v1/chat/completions
    dns.anomaly-detector.llm-studio.allow-local=true
    dns.anomaly-detector.llm-studio.model=google/gemma-4-e2b
    dns.anomaly-detector.timeout-seconds=120
    dns.anomaly-detector.llm-studio.timeout-seconds=120
    dns.anomaly-detector.llm-studio.api-key=
    dns.anomaly-detector.llm-studio.local-port=1234

    dns.anomaly-detector.trust-threshold=0.7
    dns.anomaly-detector.processed-ttl-seconds=3600

    # \u041D\u0435 \u0431\u043E\u043B\u0435\u0435 2 DNS-\u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u043A LLM \u0432 \u0447\u0430\u0441.
    dns.anomaly-detector.max-requests-per-minute=2

    dns.anomaly-detector.circuit-breaker.failure-threshold=5
    dns.anomaly-detector.circuit-breaker.timeout-seconds=900
    dns.anomaly-detector.task-ttl-seconds=900
    dns.anomaly-detector.max-domain-length=253
    dns.anomaly-detector.max-reason-length=500
    dns.anomaly-detector.max-prompt-length=4096
    dns.anomaly-detector.max-queue-size=128
    dns.anomaly-detector.max-processed-domains=100000
    dns.anomaly-detector.max-processed-clients=100000

    # \u041E\u0434\u0438\u043D DNS LLM-\u0437\u0430\u043F\u0440\u043E\u0441 \u043D\u0435 \u0447\u0430\u0449\u0435 \u0447\u0435\u043C \u0440\u0430\u0437 \u0432 30 \u043C\u0438\u043D\u0443\u0442.
    dns.anomaly-detector.min-llm-interval-millis=1800000


    # ============================================================
    # HTTP ANOMALY DETECTOR (LLM)
    # ============================================================

    # LLM \u0432\u043A\u043B\u044E\u0447\u0451\u043D, \u043D\u043E \u043E\u0431\u0440\u0430\u0449\u0435\u043D\u0438\u044F \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u044E\u0442\u0441\u044F \u0440\u0435\u0434\u043A\u043E.
    http.anomaly-detector.enabled=true

    http.anomaly-detector.llm-studio.url=http://localhost:1234/v1/chat/completions
    http.anomaly-detector.allow-local=true
    http.anomaly-detector.llm-studio.allow-local=true
    http.anomaly-detector.model=google/gemma-4-e2b
    http.anomaly-detector.llm-studio.model=google/gemma-4-e2b
    http.anomaly-detector.timeout-seconds=120
    http.anomaly-detector.llm-studio.timeout-seconds=120
    http.anomaly-detector.llm-studio.api-key=
    http.anomaly-detector.llm-studio.local-port=1234

    http.anomaly-detector.trust-threshold=0.7
    http.anomaly-detector.processed-ttl-seconds=7200
    http.anomaly-detector.task-ttl-seconds=1800
    # \u041D\u0435 \u0431\u043E\u043B\u0435\u0435 1 HTTP-\u0437\u0430\u043F\u0440\u043E\u0441\u0430 \u043A LLM \u0432 \u0447\u0430\u0441.
    http.anomaly-detector.max-requests-per-minute=1

    http.anomaly-detector.inspect-body=false

    http.anomaly-detector.circuit-breaker.failure-threshold=5
    http.anomaly-detector.circuit-breaker.timeout-seconds=900

    http.anomaly-detector.max-path-length=2048
    http.anomaly-detector.max-headers-length=8192
    http.anomaly-detector.max-domain-length=253
    http.anomaly-detector.max-reason-length=500
    http.anomaly-detector.max-queue-size=64
    http.anomaly-detector.body-preview-length=0

    # \u041D\u0435 \u0447\u0430\u0449\u0435 \u043E\u0434\u043D\u043E\u0433\u043E HTTP LLM-\u0437\u0430\u043F\u0440\u043E\u0441\u0430 \u0432 30 \u043C\u0438\u043D\u0443\u0442.
    http.anomaly-detector.min-llm-interval-millis=1800000
    http.anomaly-detector.max-prompt-length=4096
    llm.queue.max-size=128
    llm.queue.offer-timeout-millis=0

    # ============================================================
    # WORKER POOL
    # ============================================================

    worker-pool.queue-size=2000
    worker-pool.rejection-policy=CALLER_RUNS


    # ============================================================
    # LOGGING
    # ============================================================

    logging.level=INFO
    logging.file=logs/app.log
    logging.max-file-size=100MB
    logging.max-history=7

# --- RKN Local Source (File-based) ---
# \u042D\u0442\u043E\u0442 \u0444\u043B\u0430\u0433 \u0442\u0435\u043F\u0435\u0440\u044C \u0444\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u0438 \u0438\u0433\u043D\u043E\u0440\u0438\u0440\u0443\u0435\u0442\u0441\u044F \u0434\u043B\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0438 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043E\u0432\u0430\u043D\u0438\u044F \u0444\u0430\u0439\u043B\u0430,
# \u043D\u043E \u043E\u0441\u0442\u0430\u0432\u043B\u0435\u043D \u0434\u043B\u044F \u044F\u0432\u043D\u043E\u0433\u043E \u043E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F, \u0435\u0441\u043B\u0438 \u043D\u0443\u0436\u043D\u043E.
blacklist.rkn.local.enabled=true

blacklist.rkn.operator-name=MyOperator
blacklist.rkn.inn=1234567890

# Base64 \u0434\u0430\u043D\u043D\u044B\u0435 (\u043F\u0443\u0441\u0442\u044B\u0435 \u0441\u0442\u0440\u043E\u043A\u0438 \u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u044B \u0434\u043B\u044F \u0442\u0435\u0441\u0442\u043E\u0432)
blacklist.rkn.request-base64=
blacklist.rkn.signature-base64=
blacklist.rkn.emchd-base64=
blacklist.rkn.emchd-filename=mchd.xml
blacklist.rkn.emchd-signature-base64=

# \u0414\u0430\u043D\u043D\u044B\u0435 \u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440\u0430 (\u0434\u043E\u043B\u0436\u043D\u044B \u0441\u043E\u0432\u043F\u0430\u0434\u0430\u0442\u044C \u0441 \u0441\u0435\u0440\u0442\u0438\u0444\u0438\u043A\u0430\u0442\u043E\u043C \u042D\u041F)
rkn.real.operator-name=\u041E\u041E\u041E "\u041C\u043E\u0439 \u041E\u043F\u0435\u0440\u0430\u0442\u043E\u0440"
rkn.real.inn=1234567890
rkn.real.ogrn=1234567890123
rkn.real.email=tech@my-operator.ru

# \u041F\u0443\u0442\u0438 \u043A \u0444\u0430\u0439\u043B\u0430\u043C (\u043E\u0431\u044F\u0437\u0430\u0442\u0435\u043B\u044C\u043D\u044B \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B SOAP)
# \u0424\u0430\u0439\u043B \u0437\u0430\u043F\u0440\u043E\u0441\u0430 (XML, \u043A\u043E\u0434\u0438\u0440\u043E\u0432\u043A\u0430 windows-1251)
rkn.real.request-file=/var/data/rkn/request.xml
# \u041E\u0442\u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0434\u043F\u0438\u0441\u044C \u0437\u0430\u043F\u0440\u043E\u0441\u0430 (PKCS#7, DER)
rkn.real.signature-file=/var/data/rkn/request.sig

# \u041C\u0430\u0448\u0438\u043D\u043E\u0447\u0438\u0442\u0430\u0435\u043C\u0430\u044F \u0434\u043E\u0432\u0435\u0440\u0435\u043D\u043D\u043E\u0441\u0442\u044C (\u043E\u043F\u0446\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u043E, \u0435\u0441\u043B\u0438 \u042D\u041F \u0444\u0438\u0437\u043B\u0438\u0446\u0430)
rkn.real.emchd-file=/var/data/rkn/mchd.xml
rkn.real.emchd-filename=mchd.xml
rkn.real.emchd-signature-file=/var/data/rkn/mchd.sig

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043E\u043F\u0440\u043E\u0441\u0430
rkn.real.dump-format-version=2.4
rkn.real.poll-interval-seconds=60
rkn.real.max-poll-attempts=15

